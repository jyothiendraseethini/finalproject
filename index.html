<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <link rel="stylesheet" href="finalproject.css">
</head>

<body>

    <header>
        <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>
        <div class="date-time">
            <span id="today"></span> |
            <span id="currentTime"></span>
        </div>
    </header>

    <main class="container">

        <!-- Messages -->
        <div id="loadingMessage" class="message loading">
            Loading employees...
        </div>

        <div id="successMessage" class="message success">
            Employee data loaded successfully.
        </div>

        <div id="errorMessage" class="message error">
            Unable to load employee data. Please try again.
        </div>

        <!-- Search -->
        <section class="box">
            <h2>Search Employee 🔎</h2>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search employee name..."
                >

                <button id="searchBtn">Search</button>
            </div>

            <div class="department-buttons">
                <button class="active" data-department="All">
                    All Employees
                </button>

                <button data-department="IT">IT</button>
                <button data-department="HR">HR</button>
                <button data-department="Finance">Finance</button>
                <button data-department="Marketing">Marketing</button>
            </div>
        </section>


        <!-- Sort -->
        <section class="box">
            <h2>Sort Employees</h2>

            <div class="sort-buttons">
                <button id="sortName">Sort by Name</button>
                <button id="sortAge">Sort by Age</button>
                <button id="sortSalary">Sort by Salary</button>
            </div>
        </section>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <h3>Total Employees</h3>
                <p id="employeeCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>

            <div class="stat-card">
                <h3>Average Salary</h3>
                <p id="averageSalary">₹0</p>
            </div>

            <div class="stat-card highest">
                <h3>Highest Paid Employee 🏆</h3>
                <p id="highestEmployee">-</p>
            </div>

        </section>


        <!-- Employee Cards -->
        <section>
            <div id="employeeGrid" class="employee-grid"></div>
        </section>


        <!-- Add Employee -->
        <section class="box add-section">

            <h2>ADD EMPLOYEE</h2>

            <div id="validationErrors" class="validation-errors">
            </div>

            <form id="employeeForm">

                <div class="form-grid">

                    <div>
                        <label>Name</label>
                        <input
                            type="text"
                            id="employeeName"
                            placeholder="Enter name"
                        >
                    </div>

                    <div>
                        <label>Age</label>
                        <input
                            type="number"
                            id="employeeAge"
                            placeholder="Enter age"
                        >
                    </div>

                    <div>
                        <label>Email</label>
                        <input
                            type="email"
                            id="employeeEmail"
                            placeholder="Enter email"
                        >
                    </div>

                    <div>
                        <label>Department</label>

                        <select id="employeeDepartment">

                            <option value="">
                                Select Department
                            </option>

                            <option value="IT">IT</option>
                            <option value="HR">HR</option>
                            <option value="Finance">
                                Finance
                            </option>
                            <option value="Marketing">
                                Marketing
                            </option>

                        </select>
                    </div>

                    <div>
                        <label>Salary</label>

                        <input
                            type="number"
                            id="employeeSalary"
                            placeholder="Enter salary"
                            min="50000"
                        >
                    </div>

                </div>

                <button
                    type="submit"
                    class="add-button"
                >
                    Add Employee
                </button>

            </form>

        </section>

    </main>

    <script src="finalproject.js"></script>

</body>
</html>
